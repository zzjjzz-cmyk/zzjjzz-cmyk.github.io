<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Jingzhe Zhou · Game Design Portfolio 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Noto+Sans+SC:wght@300;500;700;900&family=Noto+Serif+SC:wght@500;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#0c0c0e;
    --bg-2:#131316;
    --card:#15151a;
    --ink:#ECE9E2;
    --mut:#7d7d78;
    --mut-2:#9a9a93;
    --line:rgba(236,233,226,.14);
    --line-2:rgba(236,233,226,.07);
    --acc:#F0411E;       /* 时尚朱红 */
    --acc-2:#E7B75F;     /* 暖金 */
    --serif:"Noto Serif SC",serif;
    --sans:"Noto Sans SC","Space Grotesk",sans-serif;
    --disp:"Space Grotesk","Noto Sans SC",sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:var(--sans);background:var(--bg);color:var(--ink);overflow:hidden;-webkit-font-smoothing:antialiased}
  .label{font-family:var(--disp);text-transform:uppercase;letter-spacing:.32em;font-size:18px; /* 通用小标题/标签字号，例如“精选作品”“PROJECT OVERVIEW”等 */color:var(--mut)}
  ::selection{background:var(--acc);color:#fff}

  /* ---------- 首页海报 ---------- */
  #stage{position:relative;width:100vw;height:100vh;background:
    radial-gradient(120% 80% at 80% 0%, #1a1a1f 0%, transparent 55%), var(--bg);
    display:flex;flex-direction:column}
  header{position:relative;z-index:5;display:flex;justify-content:space-between;align-items:center;
    padding:26px 42px;border-bottom:1px solid var(--line)}
  header .brand{font-family:var(--disp);font-weight:700;letter-spacing:.18em;font-size:16px /* 左上角品牌名“JZ 周靖哲 · 作品集”的字号 */}
  header .brand b{color:var(--acc)}
  .hero{position:relative;z-index:4;flex:1;display:grid;grid-template-columns:1.15fr .85fr;gap:0;padding:0 42px;align-items:center}
  /* 左侧大字 */
  .hero-left .kicker{margin-bottom:22px}
  .hero-left h1{font-family:var(--sans);font-weight:900;font-size:clamp(58px,9vw,128px); /* 首页主标题字号，中文模式下主要控制“周靖哲” */line-height:.92;letter-spacing:-.02em}
  .hero-left h1 .en{display:block;font-family:var(--disp);font-weight:500;font-size:clamp(14px,1.7vw,22px); /* 首页主标题下方英文副标题“ZHOU JINGZHE”的字号 */
    letter-spacing:.5em;color:var(--mut);margin-top:18px}
  .hero-left .tag{margin-top:30px;display:flex;align-items:center;gap:16px}
  .hero-left .tag .ln{width:54px;height:1px;background:var(--acc)}
  .hero-left .tag span{font-size:15px; /* 首页姓名下方职业描述字号，如“游戏策划 · 玩法 / 关卡 / 叙事设计” */color:var(--ink);letter-spacing:.04em}
  .hero-left .tag .em{color:var(--acc);font-family:inherit;font-style:inherit;font-weight:inherit}
  .hero-left .cta{margin-top:40px;display:flex;gap:14px;flex-wrap:wrap}
  .btn{font-family:var(--disp);text-transform:uppercase;letter-spacing:.18em;font-size:14px; /* 通用按钮文字字号，例如“查看作品”“关于我”“试玩” */
    padding:14px 26px;border:1px solid var(--line);color:var(--ink);background:transparent;cursor:pointer;
    text-decoration:none;transition:.28s;display:inline-flex;align-items:center;gap:9px}
  .btn:hover{border-color:var(--acc);color:var(--acc)}
  .btn.solid{background:var(--acc);border-color:var(--acc);color:#fff}
  .btn.solid:hover{background:transparent;color:var(--acc)}

  /* 右侧作品索引 */
  .worklist{list-style:none}
  .work{position:relative;display:grid;grid-template-columns:54px 1fr auto;gap:18px;align-items:center;
    padding:22px 0;border-top:1px solid var(--line);cursor:pointer;transition:.3s}
  .work:last-child{border-bottom:1px solid var(--line)}
  .work .no{font-family:var(--disp);font-size:13px; /* 作品列表左侧编号字号，例如 01 / 02 / 03 */color:var(--mut);letter-spacing:.1em;transition:.3s}
  .work .tt{font-size:clamp(20px,2.2vw,30px); /* 主要作品名称字号，例如 Amnesia / Inside Mirror / Bargain Brawl */font-weight:700;line-height:1.05;transition:.3s}
  .work .tt small{display:block;font-family:var(--serif);font-weight:500;font-size:15px; /* 主要作品名称下方 Genre / 类型说明字号 */color:var(--mut);margin-top:4px;letter-spacing:.02em}
  .work .ar{font-family:var(--disp);color:var(--mut);opacity:0;transform:translateX(-8px);transition:.3s}
  .work:hover{padding-left:14px}
  .work:hover .no{color:var(--acc)}
  .work:hover .tt{color:var(--acc)}
  .work:hover .ar{opacity:1;transform:translateX(0);color:var(--acc)}

  /* 装饰大圆 */
  .ring{position:absolute;right:6%;top:50%;transform:translateY(-50%);width:min(46vh,440px);height:min(46vh,440px);
    border:1px solid var(--line);border-radius:50%;z-index:1;display:flex;align-items:center;justify-content:center;pointer-events:none}
  .ring::before{content:"";position:absolute;inset:26px;border:1px solid var(--line-2);border-radius:50%}
  .ring .mono{font-family:var(--disp);font-size:clamp(40px,7vw,96px); /* 背景装饰圆环中“JZ”字样的字号 */font-weight:700;color:rgba(236,233,226,.05);letter-spacing:-.04em}

  /* 底部滚动条 */
  .marquee{position:relative;z-index:5;overflow:hidden;border-top:1px solid var(--line);
    background:var(--acc);color:#fff;white-space:nowrap;height:41px;isolation:isolate}
  #mq{display:flex;width:max-content;height:40px;animation:marquee-scroll 26s linear infinite;
    font-family:var(--disp);text-transform:uppercase;letter-spacing:.2em;font-size:15px; /* 底部红色滚动字幕（marquee）的字号 */line-height:18px;
    will-change:transform}
  .marquee-group{display:flex;flex:0 0 auto;align-items:center;justify-content:space-around;
    min-width:100vw;padding:11px 0}
  .marquee-item{flex:0 0 auto;padding:0 26px}
  @keyframes marquee-scroll{from{transform:translate3d(0,0,0)}to{transform:translate3d(-50%,0,0)}}


  [hidden]{display:none!important}
  button{font:inherit}
  button:focus-visible,a:focus-visible{outline:1px solid var(--acc);outline-offset:5px}
  #stage{height:100dvh}
  header{flex-shrink:0;gap:20px}
  .brand{background:none;border:0;color:var(--ink);cursor:pointer;text-align:left}
  .brand:hover{color:var(--acc)}
  .brand .home-mark{color:var(--acc);margin-right:12px}
  .language{flex-shrink:0;border:0;background:none;color:var(--mut);font-family:var(--disp);
    font-size:16px; /* 右上角“中 / EN”语言切换按钮字号 */letter-spacing:.12em;padding:10px 0 10px 16px;cursor:pointer;transition:color .25s}
  .language .active{color:var(--acc)}.language:hover{color:var(--ink)}
  .hero{min-height:0;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);
    transition:grid-template-columns 500ms cubic-bezier(.22,.68,.2,1)}
  #stage:not([data-view="home"]) .hero{grid-template-columns:minmax(0,.72fr) minmax(0,1.28fr)}
  .hero-left{min-width:0;padding-right:32px;position:relative;z-index:2;
    transform:translateY(0);transition:transform 500ms ease}
  #stage:not([data-view="home"]) .hero-left{transform:translateY(-24px)}
  .hero-left h1{overflow-wrap:normal;transition:font-size 500ms ease;max-width:100%}
  html[lang="en"] .hero-left h1{font-family:var(--disp);font-size:clamp(58px,7.4vw,118px) /* 英文模式首页主标题“JINGZHE ZHOU”的字号 */}
  #stage:not([data-view="home"]) .hero-left h1{font-size:clamp(40px,4.5vw,72px); /* 离开首页后左侧身份/页面主标题字号 */line-height:1.05}
  #stage[data-view="project"] .hero-left h1{font-family:var(--disp);font-size:clamp(38px,4.3vw,68px) /* 进入具体项目页后左侧项目名称字号 */}
  .hero-left h1 .en{line-height:1.6;letter-spacing:.28em}
  .hero-left .tag{line-height:1.8}.tag .ln{flex-shrink:0}
  .section-identity{margin-top:32px}
  .section-identity h2{font-family:var(--disp);font-size:24px; /* 左侧 section 标识标题字号，例如 WORKS / ABOUT / PROJECT 01 */letter-spacing:.12em;font-weight:500;color:var(--acc)}
  .section-identity p{margin-top:12px;line-height:1.7}
  .header-actions{display:flex;align-items:center;gap:24px;margin-left:auto;flex-shrink:0}
  .primary-nav{display:flex;gap:12px;align-items:center}
  .primary-nav button{background:none;border:1px solid var(--line);color:var(--mut);font-family:var(--disp);font-size:18px; /* 顶部 WORKS / ABOUT 导航按钮字号 */font-weight:500;
    letter-spacing:.12em;padding:10px 18px;cursor:pointer;transition:color .2s,border-color .2s}
  .primary-nav button:hover,.primary-nav button[aria-current="page"]{color:var(--acc);border-color:var(--acc)}
  #viewHost{height:100%;min-height:0;min-width:0;border-left:0;padding-left:42px;
    position:relative;z-index:2;overflow:hidden}
  .right-view{height:100%;min-height:0;min-width:0;display:grid;grid-template-columns:minmax(0,1fr)}
  .right-view.with-nav{grid-template-columns:minmax(300px,max-content) minmax(0,1fr);gap:28px}
  .content-scroll{min-height:0;min-width:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;
    scrollbar-width:thin;scrollbar-color:var(--mut) transparent;padding:42px 12px 42px 0}
  .work-content{display:flex;flex-direction:column;justify-content:center}
  .work-content .rh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;gap:12px}
  .work{width:100%;text-align:left;background:none;color:inherit;border:0;border-top:1px solid var(--line)}
  .worklist>li:last-child .work{border-bottom:1px solid var(--line)}
  .work .tt{min-width:0}.work .tt small{line-height:1.5}.work .ar{font-size:11px; /* 主要作品名称字号，例如 Amnesia / Inside Mirror / Bargain Brawl */white-space:nowrap}
  .work:active .tt,.work.selected .tt{color:var(--acc)}
  .additional{margin-top:24px}.additional .label{letter-spacing:.18em;line-height:1.6}
  .additional .subtitle{font-size:15px; /* Additional / Earlier Projects 下方说明文字字号 */color:var(--mut);margin:5px 0 10px}
  .additional .work{padding:12px 0}.additional .work:hover{padding-left:14px}
  .ring{transition:opacity 400ms ease}
  #stage[data-view="about"] .ring,#stage[data-view="project"] .ring{opacity:0}
  .category-nav{display:flex;flex-direction:column;justify-content:safe center;
    border-right:1px solid var(--line);padding:30px 24px 30px 0;overflow-y:auto;min-height:0}
  .category-nav>button,.category-nav>.label{flex-shrink:0}
  .project-view .category-nav{order:0}
  .category-nav button{white-space:nowrap}
  .category-nav button>span{flex-shrink:0}
  .category-nav button{display:flex;gap:10px;align-items:baseline;width:100%;padding:15px 0;background:none;
    border:0;text-align:left;color:var(--mut);cursor:pointer;
    font-family:var(--disp);font-size:18px; /* 右侧项目/关于分类导航按钮文字字号 */letter-spacing:.06em;line-height:1.6;transition:color .2s}
  .category-nav button:hover,.category-nav button[aria-current="true"]{color:var(--acc)}
  .category-nav button[aria-current="true"]::after{content:"";width:12px;height:1px;background:var(--acc);flex-shrink:0;align-self:center}
  .category-nav .no{font-size:10px /* 通用小标题/标签字号，例如“精选作品”“PROJECT OVERVIEW”等 */}.category-nav .label{font-size:9px;letter-spacing:.1em;margin-top:28px;line-height:1.7}
  .content-title{font-family:var(--disp);font-size:clamp(23px,2.3vw,36px); /* 内容页较大的标题字号，例如 TENCENT GAMES */line-height:1.3;margin:14px 0 28px}
  .detail-heading{font-family:var(--disp);font-size:14px; /* 右侧项目/关于分类导航按钮文字字号 */letter-spacing:.2em;text-transform:uppercase;margin:28px 0 14px;color:var(--mut)}
  .detail-heading:first-child{margin-top:0}.detail-heading.contributions{color:var(--acc);font-size:14px /* “MY CONTRIBUTIONS / 我的工作”等强调章节标题字号 */}
  .prose p{color:var(--mut-2);line-height:1.95;font-size:14.5px; /* 项目介绍/About 页面正文段落字号 */margin-bottom:18px;max-width:64ch}
  .prose .tagline{font-family:var(--serif);font-style:italic;font-size:24px; /* 项目 tagline / 引导语的大字字号 */color:var(--ink);line-height:1.5;margin:12px 0 26px}
  .focus-list{display:flex;flex-wrap:wrap;gap:18px;margin:28px 0 8px;list-style:none;font-size:12px /* Profile 页 Gameplay / Level / Narrative 等 Focus 列表字号 */}
  .focus-list b{font-family:var(--disp);color:var(--acc);margin-right:8px;font-weight:500}
  .skill-group{margin-bottom:30px}.line-list{list-style:none}
  .line-list li{border-bottom:1px solid var(--line-2);padding:10px 0;font-size:14px; /* Capabilities / Information 中列表条目的字号 */color:var(--ink);line-height:1.7}
  .info-block{border-top:1px solid var(--line);padding-top:22px;margin-top:26px}
  .info-block:first-child{border-top:0;padding-top:0;margin-top:0}
  .prose a{color:var(--acc);text-decoration:none}.prose a:hover{text-decoration:underline}
  .feat{list-style:none;margin:20px 0}
  .feat li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:14px;align-items:baseline;
    padding:15px 0;border-top:1px solid var(--line-2);font-size:14.5px; /* Contributions 编号列表正文的字号 */color:var(--ink);line-height:1.9}
  .feat li:last-child{border-bottom:1px solid var(--line-2)}.feat li b{font-family:var(--disp);color:var(--acc);font-size:12px /* Contributions 列表左侧 01 / 02 / 03 编号字号 */}
  .tags{display:flex;flex-wrap:wrap;gap:8px;margin:24px 0}
  .tags span{font-family:var(--disp);text-transform:uppercase;letter-spacing:.1em;font-size:10px; /* 项目标签字号，例如 UNITY / GAME DESIGN / LEVEL DESIGN */color:var(--mut-2);border:1px solid var(--line);padding:6px 10px}
  .metadata{display:grid;grid-template-columns:1fr 1fr;gap:24px;border-top:1px solid var(--line);padding-top:24px;margin:24px 0}
  .metadata dt{font-family:var(--disp);font-size:14px; /* Metadata 标签字号，例如 ROLE / TEAM / PERIOD / AWARD */color:var(--mut);letter-spacing:.18em}
  .metadata dd{font-size:14px; /* Metadata 具体内容字号，例如 Lead Designer / 4-person team */line-height:1.7;margin-top:8px}
  .metadata .award{grid-column:1/-1;border-left:2px solid var(--acc);padding-left:14px;color:var(--acc)}
  .metadata .award dt{color:var(--acc)}
  .btn:disabled{opacity:.55;cursor:default}.btn:disabled:hover{color:var(--ink);border-color:var(--line)}
  .shots{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:0 0 36px}
  .prose .development-duration{color:#fff;font-size:20px;font-weight:700;line-height:1.6;margin:0 0 24px}
  .shot{border:1px solid var(--line);aspect-ratio:16/10;position:relative;overflow:hidden;background:linear-gradient(135deg,var(--card),#0e0e11)}
  .shot::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(45deg,rgba(236,233,226,.03) 0 2px,transparent 2px 12px)}
  .shot.has-media::before{display:none}
  .shot img,.shot video{display:block;width:100%;height:100%;object-fit:contain;background:#000}
  .shot span{position:absolute;bottom:10px;left:12px;right:12px;font-family:var(--disp);font-size:10px; /* 项目截图占位框底部说明文字字号 */color:var(--mut-2);line-height:1.6}
  .marquee{flex-shrink:0}
  .view-enter{animation:view-in 340ms ease both}.view-leave{animation:view-out 130ms ease both;pointer-events:none}
  .category-enter{animation:category-in 160ms ease both}.category-leave{animation:category-out 100ms ease both;pointer-events:none}
  @keyframes view-in{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:translateX(0)}}
  @keyframes view-out{to{opacity:0;transform:translateX(-16px)}}
  @keyframes category-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
  @keyframes category-out{to{opacity:0;transform:translateY(-8px)}}
  @media(min-width:861px) and (max-width:1200px){
    .hero{padding:0 28px}#viewHost{padding-left:26px}.hero-left{padding-right:24px}
    .right-view.with-nav{grid-template-columns:minmax(220px,max-content) minmax(0,1fr);gap:18px}
    .category-nav{padding-right:18px}.category-nav button{font-size:10px; /* 861–1200px 中等屏幕时右侧分类导航缩小后的字号 */gap:6px}
    .work{grid-template-columns:32px 1fr auto;gap:10px}.work .ar{font-size:9px /* 861–1200px 中等屏幕时 OPEN ▸ 的缩小字号 */}
    .hero-left .tag span{font-size:12px /* 首页姓名下方职业描述字号，如“游戏策划 · 玩法 / 关卡 / 叙事设计” */}.hero-left .tag .ln{width:24px}
  }
  @media(min-width:861px) and (max-height:760px){
    header{padding-top:16px;padding-bottom:16px}.work{padding:15px 0}
    .additional{margin-top:14px}.additional .work{padding:8px 0}.hero-left .cta{margin-top:24px}
  }
  @media(max-width:860px){
    header{padding:18px 22px;gap:14px}header .brand{font-size:10px; /* 左上角品牌名“JZ 周靖哲 · 作品集”的字号 */letter-spacing:.08em}.brand .home-mark{margin-right:6px}
    .hero,#stage:not([data-view="home"]) .hero{display:block;padding:28px 24px;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain}
    .hero-left,#stage:not([data-view="home"]) .hero-left{padding-right:0;transform:none}
    .hero-left h1,html[lang="en"] .hero-left h1{font-size:clamp(48px,12vw,86px) /* 英文模式首页主标题“JINGZHE ZHOU”的字号 */}
    #stage:not([data-view="home"]) .hero-left h1,#stage[data-view="project"] .hero-left h1{font-size:clamp(36px,9vw,60px) /* 进入具体项目页后左侧项目名称字号 */}
    .hero-left h1 .en{font-size:13px /* 首页姓名下方职业描述字号，如“游戏策划 · 玩法 / 关卡 / 叙事设计” */}.hero-left .tag{margin-top:20px}.hero-left .tag span{font-size:12px}
    .hero-left .tag .ln{width:24px}.hero-left .cta{margin-top:26px}
    .section-identity{margin-top:20px}.section-identity h2{font-size:20px /* 左侧 section 标识标题字号，例如 WORKS / ABOUT / PROJECT 01 */}
    #viewHost{height:auto;overflow:visible;padding-left:0;border-left:0;border-top:1px solid var(--line);margin-top:28px;padding-top:24px}
    .right-view,.right-view.with-nav{display:flex;flex-direction:column;height:auto;gap:0}
    .content-scroll{overflow:visible;padding:0;min-height:auto}.work-content{display:block}
    .category-nav{justify-content:flex-start;overflow:visible;border-right:0;border-top:1px solid var(--line);padding:18px 0;margin-top:24px}
    .project-view .category-nav{order:1}
    .about-view .category-nav{order:-1;display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:0 18px;border-top:0;border-bottom:1px solid var(--line);margin:0 0 26px;padding:0 0 16px}
    .category-nav button{font-size:11px /* 右侧项目/关于分类导航按钮文字字号 */}.ring{display:none}
    .work{grid-template-columns:30px 1fr auto;gap:10px}.work .ar{font-size:9px /* 手机端作品列表右侧 OPEN ▸ 字号 */}
    .btn{padding:13px 18px;letter-spacing:.12em;white-space:normal;max-width:100%}
    .label{letter-spacing:.16em;line-height:1.7}.metadata{grid-template-columns:1fr}
    .prose{overflow-wrap:break-word}.shots{gap:10px}.content-title{font-size:26px /* 手机端内容大标题字号 */}
  }

  /* HOME is the centered opening title; content views retain their shared grid. */
  .hero{--home-gutter:42px;--identity-gap:32px}
  .hero-left{container-type:inline-size;padding-right:0;margin-right:var(--identity-gap)}
  .hero-left>h1,.hero-left>.tag,.hero-left>.cta{
    width:fit-content;max-width:100%;transition:transform 500ms cubic-bezier(.22,.68,.2,1),font-size 500ms ease}
  #stage[data-view="home"] .hero-left{
    transform:translateX(calc((100vw - var(--home-gutter) * 2) * .2125 + var(--identity-gap) / 2)) scale(1.12)}
  #stage[data-view="home"] .hero-left>h1,
  #stage[data-view="home"] .hero-left>.tag,#stage[data-view="home"] .hero-left>.cta{
    transform:translateX(calc(50cqw - 50%))}
  #stage[data-view="home"] #viewHost{visibility:hidden;pointer-events:none;border-color:transparent}
  #stage[data-view="home"] .ring{opacity:0}
  @media(min-width:861px) and (max-width:1200px){.hero{--home-gutter:28px;--identity-gap:24px}}
  @media(max-width:860px){
    .hero{--identity-gap:0px}

let videoObserver;
function releaseProjectVideos() {
  videoObserver?.disconnect();
  document.querySelectorAll('.shot video').forEach(video=>{
    video.pause();
    video.removeAttribute('src');
    video.load();
  });
}
function observeProjectVideos() {
  const videos = document.querySelectorAll('.shot video');
  if(!videos.length)return;
  const update = (video, visible)=>{
    video.dataset.visible = String(visible);
    if(visible && !document.hidden) {
      if(!video.hasAttribute('src')) {
        video.src = video.dataset.src;
        video.load();
      }
      if(!reducedMotion.matches)video.play().catch(()=>{});
    } else video.pause();
  };
  if('IntersectionObserver' in window) {
    videoObserver = new IntersectionObserver(entries=>{
      entries.forEach(entry=>update(entry.target,entry.isIntersecting));
    },{threshold:0.1});
    videos.forEach(video=>videoObserver.observe(video));
  } else videos.forEach(video=>update(video,true));
}
document.addEventListener('visibilitychange',()=>{
  document.querySelectorAll('.shot video').forEach(video=>{
    if(document.hidden)video.pause();
    else if(video.dataset.visible==='true') {
      if(!video.hasAttribute('src')) {video.src=video.dataset.src;video.load();}
      if(!reducedMotion.matches)video.play().catch(()=>{});
    }
  });
});
function renderView({animate=false,categoryOnly=false,preserveScroll=false}={}) {
  clearTimeout(transitionTimer);
  const revision = ++renderRevision;
  const oldContent = $('#mainContent');
  const oldScroll = preserveScroll ? oldContent?.scrollTop || 0 : 0;
  const heroScroll = preserveScroll ? $('.hero').scrollTop : 0;
  if(!categoryOnly){renderShell();renderIdentity();}
  const target = categoryOnly ? oldContent : $('#viewHost');
  $('#viewHost').classList.remove('view-enter','view-leave');
  oldContent?.classList.remove('category-enter','category-leave');
  const commit = ()=>{
    if(revision!==renderRevision)return;
    releaseProjectVideos();
    if(categoryOnly && oldContent) {
      oldContent.innerHTML=renderAboutContent();
      document.querySelectorAll('[data-about]').forEach(button=>button.setAttribute('aria-current',String(button.dataset.about===appState.aboutSection)));
    } else {
      $('#viewHost').innerHTML = ({home:renderHome,works:renderWorks,about:renderAbout,project:renderProject})[appState.view]();
    }
    $('#mainContent').scrollTop=oldScroll;
    if(!categoryOnly || preserveScroll)$('.hero').scrollTop=heroScroll;
    observeProjectVideos();
    target?.classList.remove('view-leave','category-leave');
    if(animate&&!reducedMotion.matches)target?.classList.add(categoryOnly?'category-enter':'view-enter');
    // Keep focus on a category when it survives; otherwise move into new content.
    if(animate&&!categoryOnly && (document.activeElement===document.body || !document.activeElement.isConnected))$('#mainContent').focus({preventScroll:true});
  };
  if(animate&&!reducedMotion.matches&&target){
    target.classList.add(categoryOnly?'category-leave':'view-leave');
    transitionTimer=setTimeout(commit,categoryOnly?100:130);
  } else commit();
}
function viewHash() {
  if(appState.view===VIEW.HOME)return '';
  if(appState.view===VIEW.WORKS)return '#works';
  if(appState.view===VIEW.ABOUT)return `#about/${appState.aboutSection}`;
  return `#project/${appState.projectId}`;
}
function setView(view,options={}) {
  if(!Object.values(VIEW).includes(view))return;
  if(view===VIEW.PROJECT&&!findProject(options.projectId))return;
  const previous={...appState};
  appState.view=view;
  appState.aboutSection=view===VIEW.ABOUT?(ABOUT_SECTIONS[options.aboutSection]?options.aboutSection:'profile'):appState.aboutSection;
  appState.projectId=view===VIEW.PROJECT?options.projectId:null;
  if(options.history!==false&&location.hash!==viewHash()) {
    const url=new URL(location.href);url.hash=viewHash();history.pushState(null,'',url);
  }
  const categoryOnly=false;
  renderView({animate:options.animate!==false,categoryOnly});
}
function readRoute({animate=true}={}) {
  const parts=location.hash.slice(1).split('/');
  if(parts[0]==='works')setView(VIEW.WORKS,{history:false,animate});
  else if(parts[0]==='about')setView(VIEW.ABOUT,{aboutSection:parts[1],history:false,animate});
  else if(parts[0]==='project'&&findProject(parts[1]))setView(VIEW.PROJECT,{projectId:parts[1],history:false,animate});
  else setView(VIEW.HOME,{history:false,animate});
}
function setLanguage(language) {
  if(!I18N[language])return;
  appState.language=language;
  renderView({preserveScroll:true});renderMarquee();
}
$('#homeLink').addEventListener('click',()=>setView(VIEW.HOME));
$('#ctaWorks').addEventListener('click',()=>setView(VIEW.WORKS));
$('#ctaAbout').addEventListener('click',()=>setView(VIEW.ABOUT));
$('#languageToggle').addEventListener('click',()=>setLanguage(appState.language==='zh'?'en':'zh'));
$('#primaryNav').addEventListener('click',event=>{
  const button=event.target.closest('[data-view]');if(button)setView(button.dataset.view);
});
$('#viewHost').addEventListener('click',event=>{
  const project=event.target.closest('[data-project]');
  if(project){project.classList.add('selected');setView(VIEW.PROJECT,{projectId:project.dataset.project});return;}
  const category=event.target.closest('[data-about]');
  if(category&&category.dataset.about!==appState.aboutSection)setView(VIEW.ABOUT,{aboutSection:category.dataset.about});
});
window.addEventListener('hashchange',()=>readRoute());
readRoute({animate:false});renderMarquee();
</script>
</body>
</html>
