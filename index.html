<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Jingzhe's Storytelling Room</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main id="app">

        <!-- 首页房间 -->
        <section id="room-scene">

            <img
                class="room-bg"
                src="assets/room/room-bg.webp"
                alt=""
            >

            <!-- 角色 -->
            <button id="character-button" class="scene-object character">

                <img
                    id="character-img"
                    src="assets/character/idle.webp"
                    alt="Jingzhe Zhou"
                >

                <span class="interaction-label">
                    About Me
                </span>

            </button>


            <!-- 桌子 -->
            <button id="desk-button" class="scene-object desk">

                <img
                    src="assets/room/desk.webp"
                    alt="Project desk"
                >

                <span class="interaction-label">
                    Explore My Games
                </span>

            </button>

        </section>


        <!-- About -->
        <section id="about-view" class="view hidden">

            <button class="back-button">
                ← Back
            </button>

            <div class="about-content">

                <img
                    src="images/profile.jpg"
                    class="profile-photo"
                    alt="Jingzhe Zhou"
                >

                <div>
                    <h1>Jingzhe Zhou</h1>

                    <p>
                        Gameplay Designer interested in creating
                        memorable interactive experiences.
                    </p>
                </div>

            </div>

        </section>


        <!-- 桌面项目选择 -->
        <section id="desk-view" class="view hidden">

            <button class="back-button">
                ← Back
            </button>

            <div class="book-selection">

                <button class="book" data-project="amnesia">
                    <img src="assets/books/amnesia.webp">
                </button>

                <button class="book" data-project="inside-mirror">
                    <img src="assets/books/inside-mirror.webp">
                </button>

                <button class="book" data-project="bargain-brawl">
                    <img src="assets/books/bargain-brawl.webp">
                </button>

            </div>

        </section>

    </main>


    <!-- GSAP -->
    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js">
    </script>

    <script src="js/main.js"></script>

</body>

</html>
